services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itrainterview}
      POSTGRES_USER: ${POSTGRES_USER:-itraint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itraint} -d ${POSTGRES_DB:-itrainterview}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-itraint}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itrainterview}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.2.83:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-120}
      SANDBOX_LOCAL_DIR: /sandbox-work
      SANDBOX_HOST_DIR: ${SANDBOX_HOST_DIR:?set SANDBOX_HOST_DIR (absolute path) in .env}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-5}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_ON_START: ${SEED_ON_START:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_DIR}:/sandbox-work
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7777}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Образы-раннеры для песочницы. Собираются через:
  #   docker compose --profile runner build
  runner-python:
    profiles: ["runner"]
    build:
      context: ./runner-images
      dockerfile: python.Dockerfile
    image: itrainterview/runner-python:latest
    command: ["true"]

  runner-node:
    profiles: ["runner"]
    build:
      context: ./runner-images
      dockerfile: node.Dockerfile
    image: itrainterview/runner-node:latest
    command: ["true"]

  runner-java:
    profiles: ["runner"]
    build:
      context: ./runner-images
      dockerfile: java.Dockerfile
    image: itrainterview/runner-java:latest
    command: ["true"]

  runner-cpp:
    profiles: ["runner"]
    build:
      context: ./runner-images
      dockerfile: cpp.Dockerfile
    image: itrainterview/runner-cpp:latest
    command: ["true"]

volumes:
  pgdata:
